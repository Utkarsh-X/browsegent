<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Keyboard Prime Suggestion Combobox Fixture</title>
    <style>
      #destination-blocker {
        position: absolute;
        z-index: 2;
        top: 20px;
        left: 0;
        width: 300px;
        height: 50px;
        background: white;
      }

      #destination {
        position: absolute;
        top: 28px;
        left: 8px;
        width: 220px;
        height: 32px;
      }

      #destinations {
        margin-top: 70px;
      }
    </style>
  </head>
  <body>
    <form id="search-form">
      <label for="destination">Destination</label>
      <input id="destination" type="text" role="combobox" aria-label="Destination"
        aria-autocomplete="list" aria-haspopup="listbox" aria-controls="destinations">
      <p id="destination-blocker">Decorative label</p>
      <ul id="destinations" role="listbox" hidden>
        <li role="option">Paris</li>
      </ul>
    </form>
    <script>
      const input = document.querySelector('#destination');
      const list = document.querySelector('#destinations');
      let inputSeen = false;

      input.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown' && !inputSeen) list.hidden = false;
      });

      input.addEventListener('input', () => {
        inputSeen = true;
        if (list.hidden) input.value = '';
      });
    </script>
  </body>
</html>
