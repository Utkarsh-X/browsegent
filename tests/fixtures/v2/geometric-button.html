<!doctype html>
<html>
  <head>
    <title>Geometric Button Fixture</title>
  </head>
  <body>
    <button type="button" style="position:absolute;left:10px;top:10px;width:24px;height:24px">A</button>
    <button type="button" style="position:absolute;left:50px;top:10px;width:24px;height:24px">B</button>
    <button id="target" type="button" style="position:absolute;left:90px;top:10px;width:16px;height:16px"></button>
    <button type="button" style="position:absolute;left:130px;top:10px;width:24px;height:24px">C</button>
    <button type="button" style="position:absolute;left:170px;top:10px;width:24px;height:24px">D</button>
    <button type="button" style="position:absolute;left:210px;top:10px;width:24px;height:24px">E</button>
  </body>
</html>
